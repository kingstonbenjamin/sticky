    id: sw_dark
    name: Dark mode
    icon: mdi:theme-light-dark
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on: [ lambda: "sticky::S.dark = true; id(need_full) = true;" ]
    on_turn_off: [ lambda: "sticky::S.dark = false; id(need_full) = true;" ]
  - platform: template
    id: sw_alert_dish
    name: Alert when dishwasher is done
