# reTerminal Sticky (E1005) as a Home Assistant screen.
# Build this file. Your own home (entity ids, rooms, cities, add-ons) goes in my-home.yaml:
# copy example-home.yaml to my-home.yaml and edit it. Layouts live in sticky_ui.h.
substitutions:
  guest_ssid: !secret guest_wifi_ssid
  guest_password: !secret guest_wifi_password

packages:
  hardware: !include hardware.yaml
  home: !include my-home.yaml
  page_today: !include { file: packages/page.yaml, vars: { key: today, name: "Show Today", icon: "mdi:calendar-today", page: P_TODAY, restore: RESTORE_DEFAULT_ON } }
  page_cal: !include { file: packages/page.yaml, vars: { key: cal, name: "Show Calendar", icon: "mdi:calendar", page: P_CAL, restore: RESTORE_DEFAULT_ON } }
  page_wx: !include { file: packages/page.yaml, vars: { key: wx, name: "Show Weather", icon: "mdi:weather-partly-cloudy", page: P_WX, restore: RESTORE_DEFAULT_ON } }
  page_rem: !include { file: packages/page.yaml, vars: { key: rem, name: "Show Reminders", icon: "mdi:format-list-checks", page: P_REM, restore: RESTORE_DEFAULT_ON } }
  page_fc: !include { file: packages/page.yaml, vars: { key: fc, name: "Show Forecast", icon: "mdi:calendar-week", page: P_FC, restore: RESTORE_DEFAULT_ON } }
  page_hist: !include { file: packages/page.yaml, vars: { key: hist, name: "Show History", icon: "mdi:history", page: P_HIST, restore: RESTORE_DEFAULT_ON } }
  page_year: !include { file: packages/page.yaml, vars: { key: year, name: "Show Year", icon: "mdi:calendar-clock", page: P_YEAR, restore: RESTORE_DEFAULT_ON } }
  page_world: !include { file: packages/page.yaml, vars: { key: world, name: "Show World clock", icon: "mdi:earth", page: P_WORLD, restore: RESTORE_DEFAULT_ON } }
  page_gh: !include { file: packages/page.yaml, vars: { key: gh, name: "Show GitHub", icon: "mdi:github", page: P_GH, restore: RESTORE_DEFAULT_ON } }
  page_life: !include { file: packages/page.yaml, vars: { key: life, name: "Show Life in weeks", icon: "mdi:account-clock", page: P_LIFE, restore: RESTORE_DEFAULT_ON } }
  page_bio: !include { file: packages/page.yaml, vars: { key: bio, name: "Show Biorhythm", icon: "mdi:heart-pulse", page: P_BIO, restore: RESTORE_DEFAULT_ON } }
  page_timer: !include { file: packages/page.yaml, vars: { key: timer, name: "Show Kitchen timer", icon: "mdi:timer-outline", page: P_TIMER, restore: RESTORE_DEFAULT_ON } }
  page_wifi: !include { file: packages/page.yaml, vars: { key: wifi, name: "Show Guest Wi-Fi", icon: "mdi:qrcode", page: P_WIFI, restore: RESTORE_DEFAULT_OFF } }
  page_play: !include { file: packages/page.yaml, vars: { key: play, name: "Show Now playing", icon: "mdi:television-play", page: P_PLAY, restore: RESTORE_DEFAULT_ON } }

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # WHY: a build folder inside a git repo can confuse ESP-IDF's version lookup; my-home.yaml can move it
  build_path: ${build_path}
  includes:
    - history_data.h
    - sticky_ui.h
    - gt911_poll.h
  on_boot:
    - priority: 800
      then:
        # WHY: note which button woke it, so that press only wakes the screen instead of also turning the page
        - lambda: |-
            auto cause = esp_sleep_get_wakeup_cause();
            if (cause == ESP_SLEEP_WAKEUP_EXT1) id(wake_mask) = (uint32_t) esp_sleep_get_ext1_wakeup_status();
            id(woke_by_timer) = cause == ESP_SLEEP_WAKEUP_TIMER;
    - priority: -100
      then:
        - lambda: |-
            sticky::F.clock = id(f_clock);
            sticky::F.huge = id(f_huge);
            sticky::F.big = id(f_big);
            sticky::F.mid = id(f_mid);
            sticky::F.lbl = id(f_lbl);
            sticky::F.txt = id(f_txt);
            sticky::F.txtb = id(f_txtb);
            sticky::F.icon = id(f_icon);
            sticky::F.iconbig = id(f_iconbig);
            sticky::F.sm = id(f_sm);
            sticky::PIC.land = id(etch_land);
            sticky::PIC.port = id(etch_port);
            sticky::CFG.tv_label = "${tv_label}";
            sticky::CFG.soundbar_label = "${soundbar_label}";
            sticky::CFG.vac_usual = "${vacuum_usual_label}";
            sticky::CFG.dish_usual = "${dishwasher_usual_program}";
            sticky::S.dark = id(sw_dark).state;
            int rot = 0, base = 0;
            if (sticky::restore_state(rot, base)) id(base_rot) = base;
            else sticky::S.page = sticky::next_page(sticky::P_COUNT - 1, +1);
            id(last_activity) = millis();
        - pcf8563.read_time: rtc_time
        - script.execute: apply_rotation
        - lambda: |-
            id(need_full) = true;
            sticky_touch::T.begin(id(i2c_touch));
            id(touch_status).publish_state(sticky_touch::T.status);

logger:
  # WHY: DEBUG keeps the start-up hardware report; the chatty sensor/text lines are turned down below
  level: DEBUG
  logs:
    sensor: INFO
    text_sensor: INFO
    binary_sensor: INFO
    homeassistant.sensor: INFO
    homeassistant.text_sensor: INFO
    homeassistant.binary_sensor: INFO
  hardware_uart: USB_SERIAL_JTAG

wifi:
  # WHY: skip the network scan on wake; join the saved network straight away
  fast_connect: true
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Sticky Setup"
    password: !secret fallback_password

captive_portal:

api:
  encryption:
    key: !secret api_key
  actions:
    - action: show_alert
      variables:
        kind: string
        title: string
        detail: string
      then:
        - script.execute:
            id: raise_alert
            kind: !lambda return kind;
            title: !lambda return title;
            detail: !lambda return detail;
    - action: clear_alert
      then:
        - lambda: |-
            sticky::S.alert = false;
            id(need_full) = true;
    - action: beep
      variables:
        tune: string
      then:
        - script.execute:
            id: play_tune
            kind: !lambda return tune;
    - action: start_timer
      variables:
        minutes: int
      then:
        - script.execute:
            id: timer_cmd
            value: !lambda return minutes;
    # Opens a Do screen by name (Tiles, Home, AC room, Door, Vacuum, Dishwasher, ...) or a page inside Do
    - action: show_do
      variables:
        screen: string
      then:
        - lambda: |-
            sticky::S.alert = false;
            sticky::open_do(sticky::D_TILES);
            for (int d = 0; d < sticky::D_PAGE; d++)
              if (screen == sticky::DO_NAMES[d]) sticky::S.do_screen = d;
            for (int p = 0; p < sticky::P_COUNT; p++)
              if (screen == sticky::PAGE_NAMES[p]) { sticky::S.do_screen = sticky::D_PAGE; sticky::S.do_page = p; }
            id(last_activity) = millis();
            id(need_full) = true;
    - action: show_page
      variables:
        page: string
      then:
        - lambda: |-
            for (int p = 0; p < sticky::P_COUNT; p++)
              if (page == sticky::PAGE_NAMES[p]) sticky::S.page = p;
            sticky::S.do_mode = false;
            id(last_activity) = millis();
            id(need_full) = true;

ota:
  - platform: esphome
    password: !secret ota_password

globals:
  - id: need_full
    type: bool
    initial_value: "false"
  - id: need_partial
    type: bool
    initial_value: "false"
  - id: last_draw
    type: uint32_t
    initial_value: "0"
  - id: last_activity
    type: uint32_t
    initial_value: "0"
  - id: last_rotate
    type: uint32_t
    initial_value: "0"
  - id: cur_rot
    type: int
    initial_value: "0"
  - id: imu_rot
    type: float
    initial_value: "NAN"
  - id: base_rot
    type: int
    # WHY: keep the last way up through restarts, for when it boots lying flat and can't tell
    restore_value: true
    initial_value: "0"
  - id: touch_map
    type: int
    restore_value: true
    initial_value: "5"
  - id: cal_rx1
    type: int
    initial_value: "0"
  - id: cal_ry1
    type: int
    initial_value: "0"
  - id: wake_mask
    type: uint32_t
    initial_value: "0"
  - id: woke_by_timer
    type: bool
    initial_value: "false"
  - id: ign_ai
    type: bool
    initial_value: "false"
  - id: ign_up
    type: bool
    initial_value: "false"
  - id: ign_down
    type: bool
    initial_value: "false"
  - id: going_to_sleep
    type: bool
    initial_value: "false"
  - id: media_target
    type: std::string
    initial_value: '"${tv_entity}"'

time:
  - platform: homeassistant
    id: ha_time
    timezone: ${timezone}
    on_time_sync:
      - pcf8563.write_time: rtc_time
    on_time:
      - seconds: 0
        then:
          - lambda: if (!sticky::S.asleep) id(need_partial) = true;
  - platform: pcf8563
    id: rtc_time
    i2c_id: i2c_main
    address: 0x51
    timezone: ${timezone}
    update_interval: never

# ---------------- the Sticky's own sensors ----------------
sensor:
  - platform: sht4x
    i2c_id: i2c_main
    update_interval: 60s
    temperature:
      name: Temperature
      id: room_t
      filters:
        - sliding_window_moving_average: { window_size: 3, send_every: 1 }
      on_value:
        - lambda: sticky::S.room_t = x;
    humidity:
      name: Humidity
      id: room_h
      on_value:
        - lambda: sticky::S.room_h = x;
  - platform: bq27220
    i2c_id: i2c_main
    update_interval: 60s
    voltage:
      name: Battery voltage
      entity_category: diagnostic
    current:
      name: Battery current
      entity_category: diagnostic
      on_value:
        - lambda: sticky::S.charging = x > 0.005f;
    battery_level:
      name: Battery
      id: batt
      on_value:
        - lambda: |-
            sticky::S.batt = x;
    temperature:
      name: Battery temperature
      entity_category: diagnostic
    time_to_empty:
      name: Battery time left
      entity_category: diagnostic
    state_of_health:
      name: Battery health
      entity_category: diagnostic
  - platform: motion
    type: orientation
    name: Orientation
    entity_category: diagnostic
    filters:
      # WHY: the sensor says "unknown" while lying flat; keep the last real reading instead
      - lambda: "if (std::isnan(x)) return {}; return x;"
      - or:
          - delta: 45
          - throttle: 120s
    on_value:
      - lambda: id(imu_rot) = x;
      - script.execute: apply_rotation
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 120s
    entity_category: diagnostic
  - platform: uptime
    name: Uptime
    entity_category: diagnostic

  # ---------------- from Home Assistant ----------------
  - platform: homeassistant
    id: ha_in_1
    entity_id: ${weather_entity}
    attribute: temperature
    internal: true
    on_value:
      - lambda: sticky::S.wx_t = x; sticky::stamp(sticky::S.wx_at, id(ha_time).now()); id(need_partial) = true;
  - platform: homeassistant
    id: ha_in_2
    entity_id: ${weather_entity}
    attribute: humidity
    internal: true
    on_value:
      - lambda: sticky::S.wx_h = x;
  - platform: homeassistant
    id: ha_in_3
    entity_id: ${weather_entity}
    attribute: wind_speed
    internal: true
    on_value:
      - lambda: sticky::S.wx_wind = x;
  - platform: homeassistant
    id: ha_in_4
    entity_id: ${dishwasher_progress}
    internal: true
    on_value:
      - lambda: sticky::S.dish_prog = x; id(need_partial) = true;
  - platform: homeassistant
    id: ha_in_5
    entity_id: ${washer_progress}
    internal: true
    on_value:
      - lambda: sticky::S.wash_prog = x; id(need_partial) = true;
  - platform: homeassistant
    id: ha_in_6
    entity_id: ${tv_entity}
    attribute: volume_level
    internal: true
    on_value:
      - lambda: sticky::S.tv_vol = x; if (sticky::S.page == sticky::P_PLAY) id(need_partial) = true;
  - platform: homeassistant
    id: ha_in_7
    entity_id: ${soundbar_entity}
    attribute: volume_level
    internal: true
    on_value:
      - lambda: sticky::S.sb_vol = x; if (sticky::S.page == sticky::P_PLAY) id(need_partial) = true;

  - platform: homeassistant
    id: ha_in_39
    entity_id: ${vacuum_battery}
    internal: true
    on_value: [ lambda: "sticky::S.vac_batt = x; if (sticky::S.do_mode) id(need_partial) = true;" ]

motion:
  - platform: lsm6ds
    id: imu
    i2c_id: i2c_main
    update_interval: 2s

text_sensor:
  - platform: template
    name: Page
    id: page_name
    entity_category: diagnostic
    update_interval: never
  - platform: template
    name: Last touch
    id: last_touch
    entity_category: diagnostic
  - platform: template
    name: Touch status
    id: touch_status
    entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      name: IP address
      entity_category: diagnostic

  - platform: homeassistant
    id: ha_in_8
    entity_id: ${lock_entity}
    internal: true
    on_value:
      - lambda: sticky::S.lock_state = x; id(need_partial) = true;
  - platform: homeassistant
    id: ha_in_15
    entity_id: ${vacuum_entity}
    internal: true
    on_value:
      - lambda: sticky::S.vacuum = x; id(need_partial) = true;
  - platform: homeassistant
    id: ha_in_16
    entity_id: ${weather_entity}
    internal: true
    on_value:
      - lambda: sticky::S.wx_cond = x; sticky::stamp(sticky::S.wx_at, id(ha_time).now()); id(need_partial) = true;
  - platform: homeassistant
    id: ha_in_17
    entity_id: input_text.sticky_forecast
    internal: true
    on_value:
      - lambda: sticky::S.forecast = x; id(need_partial) = true;
  - platform: homeassistant
    id: ha_in_18
    entity_id: input_text.sticky_agenda
    internal: true
    on_value:
      - lambda: sticky::S.agenda = x; id(need_partial) = true;
  - platform: homeassistant
    id: ha_in_19
    entity_id: ${dishwasher_state}
    internal: true
    on_value:
      - lambda: |-
          std::string old = sticky::S.dish_state;
          sticky::S.dish_state = x;
          id(need_partial) = true;
          bool was_running = old == "run" || old == "pause" || old == "actionrequired" || old == "delayedstart";
          if (x == "finished" && was_running && id(sw_alert_dish).state) {
            char buf[32];
            auto t = id(ha_time).now();
            snprintf(buf, sizeof(buf), "Finished %02d:%02d", t.hour, t.minute);
            id(raise_alert).execute("dishwasher", "Dishes done", buf);
          }
  - platform: homeassistant
    id: ha_in_20
    entity_id: ${dishwasher_finish}
    internal: true
    on_value:
      - lambda: sticky::S.dish_finish = x;
  - platform: homeassistant
    id: ha_in_21
    entity_id: ${washer_state}
    internal: true
    on_value:
      - lambda: |-
          std::string old = sticky::S.wash_state;
          sticky::S.wash_state = x;
          id(need_partial) = true;
          bool was_running = old == "run" || old == "pause" || old == "actionrequired" || old == "delayedstart";
          if (x == "finished" && was_running && id(sw_alert_wash).state) {
            char buf[32];
            auto t = id(ha_time).now();
            snprintf(buf, sizeof(buf), "Finished %02d:%02d", t.hour, t.minute);
            id(raise_alert).execute("washing", "Washing done", buf);
          }
  - platform: homeassistant
    id: ha_in_22
    entity_id: ${washer_finish}
    internal: true
    on_value:
      - lambda: sticky::S.wash_finish = x;
  - platform: homeassistant
    id: ha_in_23
    entity_id: ${tv_entity}
    internal: true
    on_value:
      - lambda: |-
          bool before = sticky::playing();
          sticky::S.tv_state = x;
          if (before != sticky::playing() || sticky::S.page == sticky::P_PLAY) id(need_partial) = true;
          if (!sticky::playing() && sticky::S.page == sticky::P_PLAY) { sticky::S.page = sticky::P_TODAY; id(need_full) = true; }
  - platform: homeassistant
    id: ha_in_24
    entity_id: ${tv_entity}
    attribute: app_name
    internal: true
    on_value:
      - lambda: sticky::S.tv_app = x; if (sticky::S.page == sticky::P_PLAY) id(need_partial) = true;
  - platform: homeassistant
    id: ha_in_25
    entity_id: ${tv_entity}
    attribute: media_title
    internal: true
    on_value:
      - lambda: sticky::S.tv_title = x; if (sticky::S.page == sticky::P_PLAY) id(need_partial) = true;
  - platform: homeassistant
    id: ha_in_26
    entity_id: ${soundbar_entity}
    internal: true
    on_value:
      - lambda: |-
          sticky::S.sb_state = x;
          if (!sticky::playing() && sticky::S.page == sticky::P_PLAY) { sticky::S.page = sticky::P_TODAY; id(need_full) = true; }

  - platform: homeassistant
    id: ha_in_46
    entity_id: ${vacuum_last_clean}
    internal: true
    on_value: [ lambda: "sticky::S.vac_last = x; if (sticky::S.do_mode) id(need_partial) = true;" ]
  - platform: homeassistant
    id: ha_in_47
    entity_id: ${dishwasher_door}
    internal: true
    on_value: [ lambda: "sticky::S.dish_door = x; if (sticky::S.do_mode) id(need_partial) = true;" ]
  - platform: homeassistant
    id: ha_in_48
    entity_id: ${dishwasher_selected}
    internal: true
    on_value: [ lambda: "sticky::S.dish_selected = x; if (sticky::S.do_mode) id(need_partial) = true;" ]
  - platform: homeassistant
    id: ha_in_49
    entity_id: input_text.sticky_reminders
    internal: true
    on_value: [ lambda: "sticky::S.reminders = x; id(need_partial) = true;" ]
  - platform: homeassistant
    id: ha_in_50
    entity_id: ${dishwasher_opt_intensive}
    internal: true
    on_value: [ lambda: "sticky::S.dish_opt[0] = x; if (sticky::S.do_mode) id(need_partial) = true;" ]
  - platform: homeassistant
    id: ha_in_51
    entity_id: ${dishwasher_opt_speed}
    internal: true
    on_value: [ lambda: "sticky::S.dish_opt[1] = x; if (sticky::S.do_mode) id(need_partial) = true;" ]
  - platform: homeassistant
    id: ha_in_52
    entity_id: ${dishwasher_opt_hygiene}
    internal: true
    on_value: [ lambda: "sticky::S.dish_opt[2] = x; if (sticky::S.do_mode) id(need_partial) = true;" ]
  - platform: homeassistant
    id: ha_in_53
    entity_id: ${dishwasher_opt_half}
    internal: true
    on_value: [ lambda: "sticky::S.dish_opt[3] = x; if (sticky::S.do_mode) id(need_partial) = true;" ]
  - platform: homeassistant
    id: ha_in_54
    entity_id: ${dishwasher_opt_silence}
    internal: true
    on_value: [ lambda: "sticky::S.dish_opt[4] = x; if (sticky::S.do_mode) id(need_partial) = true;" ]

  - platform: homeassistant
    id: ha_hourly
    entity_id: input_text.sticky_hourly
    internal: true
    on_value: [ lambda: "sticky::S.hourly = x; sticky::stamp(sticky::S.wx_at, id(ha_time).now()); if (sticky::S.page == sticky::P_WX) id(need_partial) = true;" ]
  - platform: homeassistant
    id: ha_birth
    entity_id: input_text.sticky_birth_date
    internal: true
    on_value: [ lambda: "sticky::S.birth = x; id(need_partial) = true;" ]

binary_sensor:
  - platform: gpio
    name: On charger
    id: on_charger
    pin: GPIO9
    on_state:
      - lambda: |-
          sticky::S.on_charger = x;
          id(last_activity) = millis();
          id(need_partial) = true;
  - platform: homeassistant
    entity_id: ${watering_1}
    id: water1
    internal: true
    on_state: [ lambda: "sticky::S.watering = id(water1).state || id(water2).state || id(water3).state; id(need_partial) = true;" ]
  - platform: homeassistant
    entity_id: ${watering_2}
    id: water2
    internal: true
    on_state: [ lambda: "sticky::S.watering = id(water1).state || id(water2).state || id(water3).state; id(need_partial) = true;" ]
  - platform: homeassistant
    entity_id: ${watering_3}
    id: water3
    internal: true
    on_state: [ lambda: "sticky::S.watering = id(water1).state || id(water2).state || id(water3).state; id(need_partial) = true;" ]
  - platform: homeassistant
    entity_id: ${dishwasher_remote_start}
    id: dish_remote
    internal: true
    on_state: [ lambda: "sticky::S.dish_remote = x; if (sticky::S.do_mode) id(need_partial) = true;" ]
  - platform: homeassistant
    entity_id: ${vacuum_problem}
    id: vac_problem
    internal: true
    on_state:
      - lambda: |-
          bool was = sticky::S.vacuum_problem;
          sticky::S.vacuum_problem = x;
          if (x && !was && id(sw_alert_vac).state) id(raise_alert).execute("vacuum", "Vacuum needs help", "Check the robot");

  # Buttons: AI (top), Up, Down. Short press flips pages; all presses also go to HA as events.
  - platform: gpio
    id: btn_ai
    name: AI button
    pin: { number: GPIO4, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    on_press:
      - lambda: |-
          id(last_activity) = millis();
          id(woke_by_timer) = false;
          if ((id(wake_mask) & (1u << 4)) && millis() < 2000) id(ign_ai) = true;
          id(wake_mask) &= ~(1u << 4);
    on_multi_click:
      - timing: [ ON for at most 0.8s, OFF for at least 0.4s ]
        then:
          - lambda: |-
              if (id(ign_ai)) { id(ign_ai) = false; return; }
              id(ev_ai).trigger("press");
              sticky::press_ai();
              id(need_full) = true;
      - timing: [ ON for at most 0.8s, OFF for at most 0.4s, ON for at most 0.8s, OFF for at least 0.2s ]
        then: [ lambda: "if (id(ign_ai)) { id(ign_ai) = false; return; } id(ev_ai).trigger(\"double_press\");" ]
      - timing: [ ON for at least 1s ]
        then: [ lambda: "if (id(ign_ai)) { id(ign_ai) = false; return; } id(ev_ai).trigger(\"long_press\");" ]
  - platform: gpio
    id: btn_up
    name: Up button
    pin: { number: GPIO5, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    on_press:
      - lambda: |-
          id(last_activity) = millis();
          id(woke_by_timer) = false;
          if ((id(wake_mask) & (1u << 5)) && millis() < 2000) id(ign_up) = true;
          id(wake_mask) &= ~(1u << 5);
    on_multi_click:
      - timing: [ ON for at most 0.8s, OFF for at least 0.4s ]
        then:
          - lambda: |-
              if (id(ign_up)) { id(ign_up) = false; return; }
              id(ev_up).trigger("press");
              sticky::press_step(-1);
              id(need_full) = true;
      - timing: [ ON for at most 0.8s, OFF for at most 0.4s, ON for at most 0.8s, OFF for at least 0.2s ]
        then: [ lambda: "if (id(ign_up)) { id(ign_up) = false; return; } id(ev_up).trigger(\"double_press\");" ]
      - timing: [ ON for at least 1s ]
        then: [ lambda: "if (id(ign_up)) { id(ign_up) = false; return; } id(ev_up).trigger(\"long_press\");" ]
  - platform: gpio
    id: btn_down
    name: Down button
    pin: { number: GPIO6, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    on_press:
      - lambda: |-
          id(last_activity) = millis();
          id(woke_by_timer) = false;
          if ((id(wake_mask) & (1u << 6)) && millis() < 2000) id(ign_down) = true;
          id(wake_mask) &= ~(1u << 6);
    on_multi_click:
      - timing: [ ON for at most 0.8s, OFF for at least 0.4s ]
        then:
          - lambda: |-
              if (id(ign_down)) { id(ign_down) = false; return; }
              id(ev_down).trigger("press");
              sticky::press_step(+1);
              id(need_full) = true;
      - timing: [ ON for at most 0.8s, OFF for at most 0.4s, ON for at most 0.8s, OFF for at least 0.2s ]
        then: [ lambda: "if (id(ign_down)) { id(ign_down) = false; return; } id(ev_down).trigger(\"double_press\");" ]
      - timing: [ ON for at least 1s ]
        then: [ lambda: "if (id(ign_down)) { id(ign_down) = false; return; } id(ev_down).trigger(\"long_press\");" ]

event:
  - platform: template
    id: ev_ai
    name: AI button press
    event_types: [press, double_press, long_press]
  - platform: template
    id: ev_up
    name: Up button press
    event_types: [press, double_press, long_press]
  - platform: template
    id: ev_down
    name: Down button press
    event_types: [press, double_press, long_press]

# ---------------- settings shown in Home Assistant ----------------
switch:
