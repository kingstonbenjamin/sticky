button:
  - platform: template
    name: Refresh screen
    icon: mdi:refresh
    on_press: [ lambda: "id(need_full) = true; id(last_activity) = millis();" ]
  - platform: template
    name: Clear alert
    icon: mdi:bell-off
    on_press: [ lambda: "sticky::S.alert = false; id(need_full) = true;" ]
  - platform: template
    name: Test beep
    icon: mdi:bullhorn
    entity_category: diagnostic
    on_press:
      - rtttl.play: "test:d=8,o=6,b=180:c,e,g"
  - platform: template
    name: Set up touch
    icon: mdi:gesture-tap
    on_press:
      - lambda: |-
          sticky::S.alert = false;
          sticky::S.touch_setup = 1;
          id(last_activity) = millis();
          id(woke_by_timer) = false;
          id(need_full) = true;
  - platform: template
    name: Test touch (15 dots)
    icon: mdi:target
    entity_category: diagnostic
    on_press:
      - lambda: |-
          sticky::S.alert = false;
          sticky::S.touch_setup = 0;
          sticky::S.touch_test = 1;
          sticky::S.tt_drawn = 0;
          id(last_activity) = millis();
          id(woke_by_timer) = false;
          id(need_full) = true;
  - platform: template
    name: Restart touch
    icon: mdi:gesture-tap-hold
    entity_category: diagnostic
    on_press:
      - lambda: sticky_touch::T.begin(id(i2c_touch));
  - platform: template
    name: Show test alert
    icon: mdi:bell-ring
    entity_category: diagnostic
    on_press:
      - script.execute:
          id: raise_alert
          kind: "dishwasher"
          title: "Test alert"
          detail: "Tap the screen to clear"
  - platform: restart
    name: Restart
    entity_category: diagnostic

deep_sleep:
  id: ds
  sleep_duration: 15min
  esp32_ext1_wakeup:
    pins:
      - pin: { number: GPIO4, allow_other_uses: true }
      - pin: { number: GPIO5, allow_other_uses: true }
      - pin: { number: GPIO6, allow_other_uses: true }
    mode: ANY_LOW

# ---------------- behaviour ----------------
script:
  - id: raise_alert
    mode: queued
    parameters:
      kind: string
      title: string
      detail: string
    then:
      - lambda: |-
          if (kind == "camera" && !id(sw_alert_cam).state) return;
          sticky::S.alert = true;
          sticky::S.alert_kind = kind;
          sticky::S.alert_title = title;
          sticky::S.alert_detail = detail;
          id(last_activity) = millis();
          id(need_full) = true;
      - script.execute:
          id: play_tune
          kind: !lambda return kind;

  - id: play_tune
    mode: restart
    parameters:
      kind: string
    then:
      - lambda: |-
          if (!id(sw_beep).state && kind != "timer" && kind != "test") return;
          auto t = id(ha_time).now();
          bool night = t.is_valid() && (t.hour >= 22 || t.hour < 7);
          if (night && id(sw_quiet).state && kind != "timer" && kind != "test") return;
          std::string tune = "beep:d=8,o=6,b=200:e,p,e";
          if (kind == "dishwasher") tune = "dish:d=8,o=6,b=180:c,e,g,p,c,e,g";
          else if (kind == "washing") tune = "wash:d=8,o=5,b=160:g,c6,e6,p,g,c6,e6";
          else if (kind == "timer") tune = "timer:d=16,o=6,b=200:c,p,c,p,c,p,c,8p,c,p,c,p,c,p,c,8p,c,p,c,p,c,p,c";
          else if (kind == "camera") tune = "cam:d=8,o=6,b=200:e,p,e,p,e";
          else if (kind == "vacuum") tune = "vac:d=8,o=5,b=160:c6,g,c6";
          else if (kind == "test") tune = "test:d=8,o=6,b=180:c,e,g";
          id(buzzer).play(tune);

  - id: apply_rotation
    mode: queued
    then:
      - lambda: |-
          int mode = id(sel_orient).active_index().value_or(0);
          int flip = id(sel_flip).active_index().value_or(0);
          float o = id(imu_rot);
          int base = id(base_rot);
          if (mode == 1) base = 0;
          else if (mode == 2) base = 90;
          else if (!std::isnan(o)) base = sticky::rot_from_motion((int) lroundf(o / 90.f) * 90);
          id(base_rot) = base;
          int rot = sticky::apply_flip(base, flip);
          if (rot != id(cur_rot) || id(last_draw) == 0) {
            id(cur_rot) = rot;
            id(epd).set_rotation((esphome::display::DisplayRotation) rot);
            id(need_full) = true;
          }

  - id: handle_touch
    mode: queued
    parameters:
      rx: int
      ry: int
    then:
      - lambda: |-
          auto &S = sticky::S;
          id(last_activity) = millis();
          id(woke_by_timer) = false;
          int W = id(epd).get_width(), H = id(epd).get_height();
          char buf[100];
          if (S.touch_setup == 1) {
            id(cal_rx1) = rx; id(cal_ry1) = ry;
            S.touch_setup = 2;
            id(need_full) = true;
            snprintf(buf, sizeof(buf), "setup dot 1: raw %d,%d", rx, ry);
            id(last_touch).publish_state(buf);
            return;
          }
          if (S.touch_setup == 2) {
            int rxs[2] = {id(cal_rx1), rx}, rys[2] = {id(cal_ry1), ry};
            int err = 0;
            int m = sticky::calibrate_touch(id(cur_rot), rxs, rys, W, H, err);
            S.touch_setup = 0;
            S.alert = true;
            if (err < 160) {
              id(touch_map) = m;
              S.alert_kind = "ok"; S.alert_title = "Touch is set up"; S.alert_detail = "Tap anywhere to close";
            } else {
              S.alert_kind = "touch"; S.alert_title = "Touch setup missed"; S.alert_detail = "Try again: Set up touch in HA";
            }
            snprintf(buf, sizeof(buf), "setup dot 2: raw %d,%d, map %d, miss %d px", rx, ry, m, err);
            id(last_touch).publish_state(buf);
            id(need_full) = true;
            return;
          }
          int x, y;
          sticky::touch_to_screen(id(touch_map), id(cur_rot), rx, ry, x, y);
          if (S.touch_test) {
            // WHY: a tap before the next dot is on screen (or a double tap) would be scored against the wrong dot;
            // the panel needs about a second after drawing before the new dot is really visible
            if (S.tt_drawn != S.touch_test || millis() - S.tt_at < 1000 || millis() - S.tt_shown_at < 1500) return;
            S.tt_at = millis();
            if (S.touch_test > sticky::TT_N) { S.touch_test = 0; id(need_full) = true; return; }
            int i = S.touch_test - 1, tx, ty;
            sticky::test_target(i, W, H, tx, ty);
            S.tt_miss[i] = (int) lroundf(hypotf(x - tx, y - ty));
            snprintf(buf, sizeof(buf), "test dot %d/15 (turned %d): aim %d,%d got %d,%d miss %d", S.touch_test,
                     id(cur_rot), tx, ty, x, y, S.tt_miss[i]);
            id(last_touch).publish_state(buf);
            S.touch_test++;
            id(need_partial) = true;
            return;
          }
          snprintf(buf, sizeof(buf), "raw %d,%d -> %d,%d (turned %d)", rx, ry, x, y, id(cur_rot));
          id(last_touch).publish_state(buf);
          if (S.asleep) return;
          id(tap_at).execute(x, y);

  # A tap at a screen point (from the touch chip, or sent by HA's test action "tap")
  - id: tap_at
    mode: queued
    parameters:
      x: int
      y: int
    then:
      - lambda: |-
          id(last_activity) = millis();
          auto t = sticky::on_tap(x, y, id(epd).get_width(), id(epd).get_height());
          if (t.kind == 1 || t.kind == 5) id(need_full) = true;
          else if (t.kind == 6) { id(ha_do).execute(t.what, t.target, t.val); id(need_full) = true; }
          else if (t.kind == 3) id(media_cmd).execute(t.value);
          else if (t.kind == 4) id(timer_cmd).execute(t.value);

  # Do-side actions run in Home Assistant's "Sticky: do" script (same steps as Inkhouse)
  - id: ha_do
    mode: queued
    parameters:
      what: string
      target: string
      val: string
    then:
      - homeassistant.action:
          action: script.sticky_do
          data:
            what: !lambda return what;
            target: !lambda return target;
            value: !lambda return val;

  - id: media_cmd
    mode: queued
    parameters:
      cmd: int
    then:
      - lambda: |-
          bool tv = !(sticky::S.tv_state.empty() || sticky::S.tv_state == "off" || sticky::S.tv_state == "unavailable" || sticky::S.tv_state == "unknown");
          id(media_target) = tv ? "${tv_entity}" : "${soundbar_entity}";
      - if:
          condition: { lambda: "return cmd == 1;" }
          then: [ homeassistant.action: { action: media_player.media_previous_track, data: { entity_id: !lambda "return id(media_target);" } } ]
      - if:
          condition: { lambda: "return cmd == 2;" }
          then: [ homeassistant.action: { action: media_player.media_play_pause, data: { entity_id: !lambda "return id(media_target);" } } ]
      - if:
          condition: { lambda: "return cmd == 3;" }
          then: [ homeassistant.action: { action: media_player.media_next_track, data: { entity_id: !lambda "return id(media_target);" } } ]
      - if:
          condition: { lambda: "return cmd == 4;" }
          then: [ homeassistant.action: { action: media_player.volume_down, data: { entity_id: !lambda "return id(media_target);" } } ]
      - if:
          condition: { lambda: "return cmd == 5;" }
          then: [ homeassistant.action: { action: media_player.volume_up, data: { entity_id: !lambda "return id(media_target);" } } ]

  - id: timer_cmd
    mode: queued
    parameters:
      value: int
    then:
      - lambda: |-
          auto &S = sticky::S;
          auto now_ms = millis();
          if (value > 0) {
            S.timer_total_s = value * 60; S.timer_left_s = S.timer_total_s;
            S.timer_end_ms = now_ms + S.timer_total_s * 1000; S.timer_run = true; S.timer_paused = false;
            S.page = sticky::P_TIMER;
          } else if (value == -1) {
            if (S.timer_run) { S.timer_end_ms += 60000; S.timer_total_s += 60; }
            else if (S.timer_paused) { S.timer_left_s += 60; S.timer_total_s += 60; }
            else { S.timer_total_s = 60; S.timer_left_s = 60; S.timer_end_ms = now_ms + 60000; S.timer_run = true; }
          } else if (value == -2) {
            if (S.timer_run) { S.timer_left_s = (S.timer_end_ms - now_ms) / 1000; S.timer_run = false; S.timer_paused = true; }
            else if (S.timer_paused) { S.timer_end_ms = now_ms + S.timer_left_s * 1000; S.timer_run = true; S.timer_paused = false; }
          } else if (value == -3) {
            S.timer_run = false; S.timer_paused = false; S.timer_left_s = 0; S.timer_total_s = 0;
          }
          if (S.timer_run) {
            auto t = id(ha_time).now();
            if (t.is_valid()) {
              int m = t.hour * 60 + t.minute + (int) ((S.timer_end_ms - now_ms) / 1000 + t.second) / 60;
              char b[8]; snprintf(b, sizeof(b), "%02d:%02d", (m / 60) % 24, m % 60);
              S.timer_ring_at = b;
            }
          }
          id(need_partial) = true;

  - id: go_sleep
    mode: single
    then:
      - lambda: |-
          id(going_to_sleep) = true;
          sticky::S.asleep = true;
          auto t = id(ha_time).now();
          if (!t.is_valid()) t = id(rtc_time).now();
          char b[8];
          if (t.is_valid()) snprintf(b, sizeof(b), "%d:%02d", t.hour, t.minute); else snprintf(b, sizeof(b), "--:--");
          sticky::S.asleep_at = b;
          id(sticky_redraw).execute(true);
      - delay: 1s
      - wait_until:
          condition:
            not:
              epaper_spi.is_updating: epd
          timeout: 25s
      - lambda: |-
          id(ds).set_sleep_duration((uint32_t) id(num_wake_every).state * 60000);
          // WHY: keep the battery power latch and button pull-ups alive while the chip sleeps
          for (gpio_num_t p : {GPIO_NUM_4, GPIO_NUM_5, GPIO_NUM_6}) {
            rtc_gpio_pullup_en(p);
            rtc_gpio_pulldown_dis(p);
          }
          gpio_hold_en(GPIO_NUM_45);
          gpio_hold_en(GPIO_NUM_46);
          gpio_deep_sleep_hold_en();
          sticky::S.asleep = false;
          sticky::S.do_mode = false;
          sticky::save_state(id(cur_rot), id(base_rot));
      - deep_sleep.enter: ds

  - id: sticky_redraw
    mode: queued
    parameters:
      full: bool
    then:
      - lambda: |-
          if (full) id(epd).request_full_update();
          id(epd).update();
          id(last_draw) = millis();

interval:
  # Screen updates, kitchen timer, page rotation and sleep, checked once a second
  - interval: 1s
    then:
      - lambda: |-
          auto &S = sticky::S;
          uint32_t now = millis();
          // kitchen timer
          if (S.timer_run) {
            int32_t left_ms = (int32_t) (S.timer_end_ms - now);
            uint32_t left = left_ms > 0 ? (left_ms + 999) / 1000 : 0;
            if (left != S.timer_left_s) {
              S.timer_left_s = left;
              if (S.page == sticky::P_TIMER && !S.alert && (left % 10 == 0 || left <= 10)) id(need_partial) = true;
            }
            if (left == 0) {
              S.timer_run = false;
              id(raise_alert).execute("timer", "Timer done", (std::to_string(S.timer_total_s / 60) + " min are up").c_str());
            }
          }
          bool on_batt = !id(on_charger).state || id(sw_test_battery).state;
          // page rotation, only on the charger and 2 min after the last touch or button
          int rsel = id(sel_rotate).active_index().value_or(1);
          uint32_t every = rsel == 0 ? 60000 : rsel == 1 ? 180000 : rsel == 2 ? 600000 : 0;
          // Do goes back to Glance after 5 minutes untouched
          if (S.do_mode && now - id(last_activity) > 300000) { S.do_mode = false; id(need_full) = true; }
          if (!on_batt && every && !S.alert && !S.do_mode && !S.timer_run &&
              now - id(last_rotate) > every && now - id(last_activity) > 120000) {
            int np = sticky::next_page(S.page, +1);
            id(last_rotate) = now;
            if (np != S.page) { S.page = np; id(need_full) = true; }
          }
          if (S.page != sticky::P_TODAY && !sticky::page_available(S.page)) { S.page = sticky::next_page(S.page, +1); id(need_full) = true; }
          // the page dots go away a few seconds after the page changed
          if (S.dots_drawn && now - S.dots_ms >= sticky::DOTS_MS) id(need_partial) = true;
          // WHY: only Home Assistant subscribes to states; a log viewer connecting and leaving must not count as HA going away
          bool ha = esphome::api::global_api_server->is_connected_with_state_subscription();
          if (ha != S.ha_ok) {
            S.ha_ok = ha;
            auto t = id(rtc_time).now();
            char b[8];
            snprintf(b, sizeof(b), "%d:%02d", t.is_valid() ? t.hour : 0, t.is_valid() ? t.minute : 0);
            S.ha_lost_at = ha || !t.is_valid() ? "" : b;
            id(need_partial) = true;
          }
          // report the page to HA when it changes
          std::string pn = sticky::page_label();
          if (pn != id(page_name).state) id(page_name).publish_state(pn);
          // the wake-up press is only ignored right after waking
          if (now > 4000) { id(ign_ai) = false; id(ign_up) = false; id(ign_down) = false; id(wake_mask) = 0; }
          // touch setup gives up after 90 s without a tap
          if (S.touch_setup && now - id(last_activity) > 90000) { S.touch_setup = 0; id(need_full) = true; }
          if (S.touch_test && now - id(last_activity) > 120000) { S.touch_test = 0; id(need_full) = true; }
          // sleep on battery; a timed wake (nobody pressing anything) only stays up long enough to refresh
          if (id(going_to_sleep)) return;
          uint32_t awake_ms = id(woke_by_timer) ? 25000 : (uint32_t) id(num_awake_time).state * 1000;
          if (on_batt && !id(sw_keep_awake).state && !S.timer_run && !S.touch_setup && !S.touch_test &&
              now - id(last_activity) > awake_ms && now > 15000) {
            id(go_sleep).execute();
          }
  # Screen drawing, checked often so a press shows quickly
  - interval: 200ms
    then:
      - lambda: |-
          if (id(going_to_sleep)) return;
          uint32_t now = millis();
          bool busy = id(epd).is_updating();
          if (!busy && id(need_full)) {
            id(need_full) = false; id(need_partial) = false;
            id(sticky_redraw).execute(true);
          } else if (!busy && id(need_partial) && now - id(last_draw) > 3000) {
            id(need_partial) = false;
            id(sticky_redraw).execute(false);
          }
  # Touch chip readout for HA while testing
  - interval: 3s
    then:
      - lambda: |-
          std::string t = sticky_touch::T.summary();
          if (t != id(touch_status).state) id(touch_status).publish_state(t);
  # Touch chip, read about 30 times a second
  - interval: 30ms
    then:
      - lambda: |-
          int rx, ry;
          if (sticky_touch::T.poll(rx, ry)) id(handle_touch).execute(rx, ry);


image:
  - file: ${etch_land}
    id: etch_land
    type: BINARY
    transparency: chroma_key
  - file: ${etch_port}
