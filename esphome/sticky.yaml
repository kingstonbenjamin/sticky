    icon: mdi:washing-machine
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: template
    id: sw_alert_cam
    name: Alert for camera
    icon: mdi:cctv
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: template
    id: sw_alert_vac
    name: Alert when vacuum is stuck
    icon: mdi:robot-vacuum
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: template
    id: sw_beep
    name: Beep for alerts
    icon: mdi:volume-high
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: template
    id: sw_quiet
    name: Quiet 22-07
    icon: mdi:sleep
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: template
    id: sw_keep_awake
    name: Stay awake on battery
    icon: mdi:coffee
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
  - platform: template
    id: sw_test_battery
