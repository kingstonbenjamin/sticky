# Copy to secrets.yaml (git-ignored) and fill in. Use long random values for api_key and ota_password.
wifi_ssid: "your-wifi"
wifi_password: "your-wifi-password"
# 32 random bytes, base64: openssl rand -base64 32
api_key: "paste-the-output-of-openssl-here"
ota_password: "a-long-random-password"
# hotspot password used only when the Sticky cannot join your Wi-Fi
fallback_password: "another-long-password"
# shown as a QR code on the Guest Wi-Fi page
guest_wifi_ssid: "Guest"
guest_wifi_password: "guest-password"
