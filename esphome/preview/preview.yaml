    size: 104
    glyphs: *mdi

display:
  - platform: sdl
    id: epd
    update_interval: never
    dimensions:
      width: 800
      height: 480
    lambda: |-
      sticky::draw(it, id(ha_time).now(), id(guest_qr), "Home Guest");

interval:
  - interval: 2s
    then:
      - lambda: |-
          using namespace sticky;
          // a tour of the screens for the README: landscape, then portrait. 0-13 Glance pages, 14+ Do screens, 40 alert
          static const int land[20] = {P_TODAY, P_CAL, P_WX, P_FC, P_REM, P_HIST, P_YEAR, P_WORLD, P_LIFE, P_BIO, P_PLAY, P_TIMER,
                                       P_WIFI, P_GH, 14 + D_TILES, 14 + D_ROOM, 14 + D_DOOR, 14 + D_DW1, 14 + D_VW2, 40};
          static const int port[8] = {P_TODAY, P_CAL, P_WX, P_REM, 14 + D_TILES, 14 + D_ROOM, 14 + D_DW3, 14 + D_VAC};
          int s = id(step) % 28;
          bool is_land = s < 20;
          id(epd).set_rotation(is_land ? esphome::display::DISPLAY_ROTATION_0_DEGREES : esphome::display::DISPLAY_ROTATION_90_DEGREES);
          int k = is_land ? land[s] : port[s - 20];
          S.alert = false; S.asleep = false; S.do_mode = false; S.ha_lost_at = "";
          S.vwiz[0] = 2; S.vwiz[1] = 2; S.vwiz[2] = 1; S.vwiz[3] = 1;
          int64_t t = id(ha_time).now().timestamp;
          S.wx_at = t; S.gh_at = t;
          if (k == 40) { S.alert = true; S.alert_kind = "camera"; S.alert_title = "Person · Driveway"; S.alert_detail = "Seen at 18:42"; }
          else if (k < 14) S.page = k;
          else { S.do_mode = true; S.do_screen = k - 14; S.room = 0; }
          id(epd).update();
          ESP_LOGI("preview", "STEP %d", s);
          id(step)++;
