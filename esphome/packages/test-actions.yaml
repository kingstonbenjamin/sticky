# Optional: lets Home Assistant tap the screen and press buttons, for testing without anyone at the device.
# Anyone who can call HA actions can then drive the Sticky; leave this out unless you need it.
api:
  actions:
    - action: tap
      variables:
        x: int
        y: int
      then:
        - lambda: |-
            char b[64];
            snprintf(b, sizeof(b), "test tap %d,%d on %dx%d", x, y, id(epd).get_width(), id(epd).get_height());
            id(last_touch).publish_state(b);
        - script.execute: { id: tap_at, x: !lambda return x;, y: !lambda return y; }
    - action: press
      variables:
        key: string
      then:
        - lambda: |-
            id(last_activity) = millis();
            if (key == "ai") sticky::press_ai();
            else if (key == "up") sticky::press_step(-1);
            else if (key == "down") sticky::press_step(+1);
            id(need_full) = true;
